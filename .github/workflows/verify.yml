name: Verify and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10']
        include:
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt
      - name: Test canonical source
        run: python -B -m pytest
      - name: Verify blank workspace
        run: python -B tools/verify_workspace.py
      - name: Build committed player package
        run: python -B tools/build_distribution.py --target "${{ runner.temp }}/player-a/RePoG" --archive "${{ runner.temp }}/RePoG.zip" --json
      - name: Repeat build in an independent directory
        run: python -B tools/build_distribution.py --target "${{ runner.temp }}/player-b/RePoG" --archive "${{ runner.temp }}/RePoG-repeat.zip" --json
      - name: Compare reproducible archives
        run: python -c "from pathlib import Path; import hashlib; root=Path(r'${{ runner.temp }}'); first=hashlib.sha256((root/'RePoG.zip').read_bytes()).hexdigest(); second=hashlib.sha256((root/'RePoG-repeat.zip').read_bytes()).hexdigest(); assert first == second, (first, second); print(first)"
      - name: Verify extracted ZIP
        run: |
          python -m zipfile -e "${{ runner.temp }}/RePoG.zip" "${{ runner.temp }}/extracted"
          python -B "${{ runner.temp }}/extracted/RePoG/tools/verify_workspace.py" "${{ runner.temp }}/extracted/RePoG" --distribution
      - name: Upload validated player ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RePoG-player-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/RePoG.zip
          if-no-files-found: error
