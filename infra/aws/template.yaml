AWSTemplateFormatVersion: '2010-09-09'
Description: RePoG hosted Agent Seat runtime (serverless, bounded, Luna-only)
Parameters:
  RuntimeImageUri:
    Type: String
  SharedSecretArn:
    Type: String
  SiteOrigin:
    Type: String
Resources:
  WorkspaceBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireJurySessions
            Prefix: sessions/
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }
  RuntimeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource: !GetAtt RuntimeTable.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${WorkspaceBucket.Arn}/*'
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: '*'
              - Effect: Allow
                Action: states:StartExecution
                Resource:
                  - !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:repog-turn-coordinator'
                  - !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:repog-quick-forge'
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'
  RuntimeFunction:
    Type: AWS::Lambda::Function
    Properties:
      PackageType: Image
      Code: { ImageUri: !Ref RuntimeImageUri }
      Role: !GetAtt RuntimeRole.Arn
      MemorySize: 2048
      Timeout: 300
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          REPOG_TABLE: !Ref RuntimeTable
          REPOG_WORKSPACE_BUCKET: !Ref WorkspaceBucket
          REPOG_SHARED_SECRET: !Sub '{{resolve:secretsmanager:${SharedSecretArn}:SecretString}}'
          REPOG_SITE_ORIGIN: !Ref SiteOrigin
          REPOG_TURN_STATE_MACHINE_ARN: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:repog-turn-coordinator'
          REPOG_FORGE_STATE_MACHINE_ARN: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:repog-quick-forge'
          REPOG_DURABLE_EXECUTOR: tools/rpg_state.py
  RuntimeApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: repog-hosted-runtime
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref SiteOrigin]
        AllowMethods: [POST, GET]
        AllowHeaders: [content-type, x-repog-timestamp, x-repog-nonce, x-repog-signature]
  RuntimeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RuntimeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt RuntimeFunction.Arn
      PayloadFormatVersion: '2.0'
  CreateSessionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref RuntimeApi, RouteKey: 'POST /runtime/v1/sessions', Target: !Sub 'integrations/${RuntimeIntegration}' }
  HumanIntentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref RuntimeApi, RouteKey: 'POST /runtime/v1/sessions/{id}/human-intents', Target: !Sub 'integrations/${RuntimeIntegration}' }
  AgentIntentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref RuntimeApi, RouteKey: 'POST /runtime/v1/sessions/{id}/agent-intents', Target: !Sub 'integrations/${RuntimeIntegration}' }
  SessionStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref RuntimeApi, RouteKey: 'GET /runtime/v1/sessions/{id}', Target: !Sub 'integrations/${RuntimeIntegration}' }
  SessionEventsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref RuntimeApi, RouteKey: 'GET /runtime/v1/sessions/{id}/events', Target: !Sub 'integrations/${RuntimeIntegration}' }
  RuntimeStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties: { ApiId: !Ref RuntimeApi, StageName: '$default', AutoDeploy: true }
  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RuntimeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RuntimeApi}/*'
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: states.amazonaws.com }, Action: 'sts:AssumeRole' }
      Policies:
        - PolicyName: invoke-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: 'lambda:InvokeFunction', Resource: !GetAtt RuntimeFunction.Arn }
  TurnStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: repog-turn-coordinator
      RoleArn: !GetAtt StateMachineRole.Arn
      StateMachineType: STANDARD
      DefinitionString: !Sub |
        {"StartAt":"Coordinate","States":{"Coordinate":{"Type":"Wait","Seconds":15,"Next":"Resolve"},"Resolve":{"Type":"Task","Resource":"arn:${AWS::Partition}:states:::lambda:invoke","Parameters":{"FunctionName":"${RuntimeFunction.Arn}","Payload.$":"$"},"Retry":[{"ErrorEquals":["Lambda.ServiceException","Lambda.TooManyRequestsException"],"IntervalSeconds":2,"MaxAttempts":2,"BackoffRate":2}],"End":true}}}
  ForgeStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: repog-quick-forge
      RoleArn: !GetAtt StateMachineRole.Arn
      StateMachineType: STANDARD
      DefinitionString: !Sub |
        {"StartAt":"Forge","TimeoutSeconds":180,"States":{"Forge":{"Type":"Task","Resource":"arn:${AWS::Partition}:states:::lambda:invoke","Parameters":{"FunctionName":"${RuntimeFunction.Arn}","Payload.$":"$"},"End":true}}}
  RuntimeErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: RePoG hosted runtime Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref RuntimeFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  AccountCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: repog-hosted-runtime-monthly
        BudgetLimit: { Amount: 25, Unit: USD }
        BudgetType: COST
        TimeUnit: MONTHLY
Outputs:
  RuntimeUrl: { Value: !GetAtt RuntimeApi.ApiEndpoint }
  WorkspaceBucketName: { Value: !Ref WorkspaceBucket }
  RuntimeTableName: { Value: !Ref RuntimeTable }
