AWSTemplateFormatVersion: '2010-09-09'
Description: RePoG one-shot hosted runtime image builder
Parameters:
  SourceBucket:
    Type: String
  RepositoryName:
    Type: String
    Default: repog-hosted-runtime
Resources:
  RuntimeRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageScanningConfiguration: { ScanOnPush: true }
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep ten runtime images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: codebuild.amazonaws.com }, Action: 'sts:AssumeRole' }
      Policies:
        - PolicyName: build-runtime-image
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SourceBucket}/runtime-source/*'
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken]
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:CompleteLayerUpload, ecr:GetDownloadUrlForLayer, ecr:InitiateLayerUpload, ecr:PutImage, ecr:UploadLayerPart]
                Resource: !GetAtt RuntimeRepository.Arn
  ImageBuilder:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: repog-hosted-runtime-image
      ServiceRole: !GetAtt BuilderRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - aws s3 cp "s3://$SOURCE_BUCKET/runtime-source/$SOURCE_KEY" /tmp/source.zip
                - mkdir -p /tmp/source && cd /tmp/source && unzip -q /tmp/source.zip
                - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
            build:
              commands:
                - cd /tmp/source
                - docker build -f runtime/hosted/Dockerfile -t "$IMAGE_URI" .
                - docker push "$IMAGE_URI"
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: SOURCE_BUCKET, Type: PLAINTEXT, Value: placeholder }
          - { Name: SOURCE_KEY, Type: PLAINTEXT, Value: placeholder }
          - { Name: REGISTRY, Type: PLAINTEXT, Value: placeholder }
          - { Name: IMAGE_URI, Type: PLAINTEXT, Value: placeholder }
      TimeoutInMinutes: 20
Outputs:
  RepositoryUri: { Value: !GetAtt RuntimeRepository.RepositoryUri }
  ProjectName: { Value: !Ref ImageBuilder }
