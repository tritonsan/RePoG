schema_version: 10
workspace_mode: standalone
status: pending
setup_revision: 0
# Revision-bound RPG reciprocity approvals. Schema-v9 Quick/Standard combine
# actual preparation review and approval once. Older routes keep their existing
# contract; Deep v8 records its gates in session_zero_state.json. Companion
# leaves both fields null.
design_direction_approved_revision: null
preparation_approved_revision: null
# First gate. Leave blank only before the user chooses an experience.
# Allowed: rpg | companion
experience_mode: ""
# After RPG experience selection, collect/reuse a short premise before asking
# depth explicitly. Keep pending and this field blank during intake. Companion
# retains its existing routing. Intake does not advance revision/counts; the
# selected route records the saved answer. Routing gates do not count.
# RPG depth is written by `session_zero_state.py set-depth`, never by hand.
session_zero_mode: ""
# Schema-v10 RPG Quick/Standard complete required decision rows; Deep uses its
# stage ledger. Leave blank for these routes. Earlier RPG and Companion retain
# their versioned numeric targets; never silently migrate an active setup.
question_target: ""
# Deep derives this mirror from session_zero_state.json. In v10 Quick/Standard
# this count tracks unique accepted consequential decisions for progress/fatigue,
# never readiness. Revisions do not recount an already accepted decision.
questions_completed: 0
# Decision-level accounting. Use short stable labels here and keep readable
# detail in session_zero.md.
defaulted_decisions: []
deferred_decisions: []
defaults_reviewed: false
# Legacy Deep pack lifecycle. Schema-v8 Deep keeps these empty and records
# stage-local extensions in session_zero_state.json instead.
activated_packs: []
completed_packs: []
defaulted_packs: []
# Set true only after explicit permission to continue beyond 45 Deep content
# decisions. Do not pre-authorize an extension.
deep_extension_approved: false
last_checkpoint: 0
# Canonical Deep-v8 interview state. It is dormant outside RPG Deep.
deep_flow_id: rpg_deep_v8
session_zero_state_path: session_zero_state.json
ready_for_play: false
