# Revision-bound RPG reciprocity approvals. Schema-v9 Quick/Standard combine
# actual preparation review and approval once. Older routes keep their existing
# contract; Deep v8 records its gates in session_zero_state.json. Companion
# leaves both fields null.
design_direction_approved_revision: null
preparation_approved_revision: null
# First gate. Leave blank only before the user chooses an experience.
# Allowed: rpg | companion
experience_mode: ""
# Ask Session 0 depth only after experience_mode is set. Experience/depth
# routing and triggered Research Gate work do not increment questions_completed.
session_zero_mode: ""
# Deep v8 uses the stage ledger instead of a readiness question quota. Quick
# and Standard select 9 and 20–29 decisions respectively for schema v9.
question_target: ""
# Deep v8 derives this mirror from session_zero_state.json. Quick, Standard,
# Companion, and legacy routes retain their existing accounting behavior.
questions_completed: 0
# Decision-level accounting. Use short stable labels here and keep readable
# detail in session_zero.md.
defaulted_decisions: []
deferred_decisions: []
defaults_reviewed: false
# Legacy Deep pack lifecycle. Schema-v8 Deep keeps these empty and records
# stage-local extensions in session_zero_state.json instead.
activated_packs: []
completed_packs: []
defaulted_packs: []
# Set true only after explicit permission to continue beyond 45 Deep content
# decisions. Do not pre-authorize an extension.
deep_extension_approved: false
last_checkpoint: 0
# Canonical Deep-v8 interview state. It is dormant outside RPG Deep.
deep_flow_id: rpg_deep_v8
session_zero_state_path: session_zero_state.json
ready_for_play: false
